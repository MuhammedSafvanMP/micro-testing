name: Deploy All Microservices

on:
  push:
    branches:
      - main

jobs:

  # =========================
  # USER SERVICE 
  # =========================
  deploy-user:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: eu-north-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1

      # Create .env BEFORE docker build
      - name: Create User Service .env
        run: |
          echo "${{ secrets.USER_ENV }}" > ./user-service/.env

      - name: Build Docker Image
        run: |
          docker build -t hosta-user-service ./user-service

      - name: Tag Docker Image
        run: |
          docker tag hosta-user-service:latest \
          ${{ secrets.ECR_URI_USER }}/hosta-user-service:latest

      - name: Push Docker Image
        run: |
          docker push \
          ${{ secrets.ECR_URI_USER }}/hosta-user-service:latest

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster hosta-user \
            --service hosta-user-task-service \
            --force-new-deployment

  # =========================
  # BOOKING SERVICE
  # =========================
  deploy-booking:
